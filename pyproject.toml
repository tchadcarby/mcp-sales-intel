[project]
name = "mcp-sales-intel"
version = "0.1.0"
description = "Live Fiverr marketplace intelligence exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
]

[project.scripts]
mcp-sales-intel = "mcp_sales_intel.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sales_intel"]
